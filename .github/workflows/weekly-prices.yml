# Publish card prices to R2.
#
# Yuyutei blocks GitHub's cloud servers, so the scraping happens on the home
# PC (tool/weekly_prices.sh, Sundays 18:30 via Windows Task Scheduler), which
# pushes the updated CSVs + data/price_history.csv. That push starts this
# workflow, which rebuilds prices.csv and uploads both files to R2:
#   data/price_history.csv  -> R2 data/price_history.csv
#   prices.csv              -> R2 data/prices.csv
# The R2 keys live only in this repo's secrets, never on the PC.
# A failed run sends GitHub's usual failure email.
#
# It can also be started by hand: Actions tab -> "Publish prices" -> Run workflow.
#
# Secrets (Settings -> Secrets and variables -> Actions):
#   R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY
# The token only needs Object Read & Write on bucket holo-tcg-tracker-assets.

name: Publish prices

on:
  push:
    branches: [main]
    paths: [data/price_history.csv]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-prices
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build prices.csv
        run: |
          # Date it as the latest update in the history, not today, so a run
          # that starts after midnight doesn't record an extra (empty) week.
          latest=$(tail -n 1 data/price_history.csv | cut -d, -f1)
          python3 tool/export_prices.py --date "$latest"
          git diff --exit-code data/price_history.csv \
            || { echo 'price_history.csv was out of step with the CSVs - fix locally first.'; exit 1; }

      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # R2 doesn't accept the newer default checksum headers.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          # History first, so the app never sees new prices without it.
          aws s3 cp data/price_history.csv s3://holo-tcg-tracker-assets/data/price_history.csv \
            --endpoint-url "$ENDPOINT" --content-type 'text/csv; charset=utf-8'
          aws s3 cp tool/prices_out/prices.csv s3://holo-tcg-tracker-assets/data/prices.csv \
            --endpoint-url "$ENDPOINT" --content-type 'text/csv; charset=utf-8'
